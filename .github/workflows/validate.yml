name: Package and local HTTP validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run core and real loopback HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel outside source tree and verify entry point
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/snapget-check"
          if [ "$RUNNER_OS" = Windows ]; then
            py="$RUNNER_TEMP/snapget-check/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/snapget-check/bin/python"
          fi
          "$py" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$py" -c 'import snapget, snapget.cli, snapget.web.server, snapget.core.extractors; print(snapget.__file__)'
          "$py" -m snapget.cli --help
